name: Release

# 打 tag 即发 Release（tag 形如 2.2.1，也兼容 v2.2.1）
# 手工补发：Actions → Release → Run workflow，填入 tag
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布 Release 的 tag（例如 2.2.1）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 解析 tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          tag="${tag#v}"
          if [ -z "$tag" ]; then
            echo "::error::没有拿到 tag，请在 workflow_dispatch 里填写"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "解析到 tag: $tag"

      - name: 校验 tag 与 pyproject 版本一致
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "pyproject version: $version / tag: $TAG"
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag($TAG) 与 pyproject.toml 的 version($version) 不一致，先把版本号改好再打 tag"
            exit 1
          fi

      # 这个仓库直接把 commit 推到 main、不走 PR，所以 GitHub 的自动 notes 只有一个
      # Full Changelog 链接；这里按上一个 tag 区间自己列 commit。
      - name: 生成变更说明
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "OpenAI 兼容的 Gemini 网页版网关。部署方式见 README：Docker / Render / HuggingFace / 直接运行。"
            echo
            if [ -n "$prev" ]; then
              echo "## 变更（${prev} → ${TAG}）"
            else
              echo "## 变更"
            fi
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='* %s（%h）' "${prev}..${TAG}"
            else
              git log --no-merges --pretty='* %s（%h）' -n 30 "${TAG}"
            fi
          } > release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG 已存在，跳过（避免覆盖手工编辑的说明）"
            exit 0
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md \
            --generate-notes
